[workspace]
members = ["bin/playground", "crates/*"]
resolver = "2"

[workspace.dependencies]
matching = { path = "crates/matching" }
orderbook = { path = "crates/orderbook" }
telemetry = { path = "crates/telemetry" }
types = { path = "crates/types" }

[profile.release]
codegen-units = 1
lto = "fat"
